<!DOCTYPE html><html class="dark" lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{min-height:100%;margin:0;padding:0;background-color:#131313;color:#e5e2e1;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed": "#ffdadb", "inverse-on-surface": "#313030", "on-primary-fixed-variant": "#005236", "on-tertiary-container": "#780021", "secondary-fixed": "#85f8c4", "surface-container-low": "#1c1b1b", "secondary": "#68dba9", "primary-fixed": "#6ffbbe", "outline": "#86948a", "surface-container-high": "#2a2a2a", "surface-container-highest": "#353534", "error": "#ffb4ab", "tertiary": "#ffb2b7", "on-secondary-fixed": "#002114", "primary": "#4edea3", "on-tertiary-fixed-variant": "#92002a", "outline-variant": "#3c4a42", "on-surface-variant": "#bbcabf", "on-primary": "#003824", "on-primary-fixed": "#002113", "inverse-surface": "#e5e2e1", "tertiary-container": "#ff7886", "error-container": "#93000a", "on-secondary": "#003825", "on-error": "#690005", "primary-container": "#10b981", "secondary-fixed-dim": "#68dba9", "on-primary-container": "#00422b", "surface-container": "#201f1f", "tertiary-fixed-dim": "#ffb2b7", "surface-container-lowest": "#0e0e0e", "on-tertiary-fixed": "#40000d", "surface-dim": "#131313", "on-secondary-fixed-variant": "#005137", "secondary-container": "#25a475", "on-error-container": "#ffdad6", "inverse-primary": "#006c49", "on-tertiary": "#67001b", "surface-bright": "#3a3939", "on-secondary-container": "#00311f", "surface-tint": "#4edea3", "primary-fixed-dim": "#4edea3", "surface-variant": "#353534", "on-background": "#e5e2e1", "background": "#131313", "on-surface": "#e5e2e1", "surface": "#131313" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-tablet": "2rem", "space-lg": "1.5rem", "gutter": "1rem", "margin": "1rem", "space-xs": "0.25rem", "space-md": "1rem", "space-sm": "0.5rem", "margin-desktop": "3rem", "gutter-desktop": "1.5rem", "space-xl": "2rem" }, "fontFamily": { "label-sm": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "label-md": ["Inter"], "headline-lg": ["Plus Jakarta Sans"], "data-mono-md": ["Inter"], "data-mono-lg": ["Inter"], "headline-xl-mobile": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Inter"] }, "fontSize": { "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.006em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.011em", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.006em", "fontWeight": "500" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.025em", "fontWeight": "600" }], "data-mono-md": ["16px", { "lineHeight": "20px", "letterSpacing": "-0.02em", "fontWeight": "500" }], "data-mono-lg": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.03em", "fontWeight": "600" }], "headline-xl-mobile": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full px-margin py-space-lg bg-surface"><div class="flex flex-col w-full relative">
<!-- Ambient Atmospheric Emerald Radiance -->
<div class="pointer-events-none absolute -top-12 left-1/2 -translate-x-1/2 w-80 h-72 rounded-full bg-primary/10 blur-[90px] -z-10"></div>
<!-- Brand Stack (Compact) -->
<header class="flex flex-col items-center text-center mt-2 mb-6">
<div class="w-12 h-12 rounded-xl bg-surface-container-high flex items-center justify-center shadow-lg relative mb-3">
<div class="absolute inset-0 rounded-xl bg-primary/10 animate-pulse"></div>
<svg class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" fill="rgba(78,222,163,0.12)"></path><path d="M6 2v20"></path><path d="M10 7h6"></path><path d="M10 11h6"></path><path d="M10 15h4"></path></svg>
</div>
<div class="flex items-center gap-1.5 justify-center">
<h1 class="font-headline-md text-headline-md tracking-tight text-on-surface">Uddhar Diary</h1>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-primary mb-1"></span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px] mt-1 leading-snug">
      Split the bill. Never lose track of who owes what.
    </p>
</header>
<!-- Auth Card -->
<div class="w-full bg-surface-container-low rounded-xl p-5 shadow-2xl relative">
<!-- Segmented Pill Switch -->
<div class="grid grid-cols-2 p-1 bg-surface-container-lowest rounded-xl mb-6">
<button class="h-10 rounded-lg font-label-md text-label-md text-on-surface-variant transition-colors flex items-center justify-center" type="button">
        Log in
      </button>
<button class="h-10 rounded-lg bg-surface-container font-label-md text-label-md text-on-surface shadow-sm flex items-center justify-center font-semibold" type="button">
        Sign up
      </button>
</div>
<!-- Section Heading -->
<div class="mb-5">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-primary font-bold block mb-1">
        CREATE AN ACCOUNT
      </span>
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">
        Sign up for diary
      </h2>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-4" id="signupForm" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-lowest rounded-xl px-3.5 text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-container transition-all" id="fullName" placeholder="Alex Vance" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email address</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-lowest rounded-xl px-3.5 text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-container transition-all" id="email" placeholder="alex@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-lowest rounded-xl pl-3.5 pr-12 text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-container transition-all" id="password" placeholder="Create a secure password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 h-12 w-12 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<!-- 3-Segment Password Strength Indicator -->
<div class="mt-1 flex flex-col gap-1.5">
<div class="grid grid-cols-3 gap-1.5 h-1 w-full bg-surface-container-lowest rounded-full overflow-hidden p-0.5">
<div class="h-full rounded-full bg-surface-container-highest transition-colors duration-300" id="bar1"></div>
<div class="h-full rounded-full bg-surface-container-highest transition-colors duration-300" id="bar2"></div>
<div class="h-full rounded-full bg-surface-container-highest transition-colors duration-300" id="bar3"></div>
</div>
<div class="flex justify-between items-center px-0.5">
<span class="font-label-sm text-label-sm text-outline" id="strengthLabel">Minimum 8 characters</span>
<span class="font-label-sm text-label-sm font-semibold text-outline" id="strengthTag">Empty</span>
</div>
</div>
</div>
<!-- Terms & Privacy Checkbox -->
<label class="flex items-start gap-3 mt-1 cursor-pointer select-none group">
<input class="peer sr-only" id="termsCheck" required="" type="checkbox">
<div class="w-5 h-5 min-w-[20px] rounded bg-surface-container-lowest flex items-center justify-center mt-0.5 transition-all peer-checked:bg-primary peer-checked:text-on-primary text-transparent group-hover:bg-surface-container">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-tight">
          I agree to the <a class="text-on-surface underline hover:text-primary" href="#">Terms of Service</a> &amp; <a class="text-on-surface underline hover:text-primary" href="#">Privacy Policy</a>
</span>
</label>
<!-- Primary Action CTA -->
<button class="w-full h-12 bg-primary-container hover:bg-secondary-container active:scale-[0.98] text-on-primary-container rounded-xl font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 transition-all mt-2 shadow-lg shadow-primary-container/20" id="submitBtn" type="submit">
<span class="">Create account</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Bottom Account Switch Link -->
<div class="mt-5 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Already have an account? 
        <a class="font-label-md text-label-md text-primary font-semibold hover:underline ml-1" href="#">Log in</a>
</p>
</div>
</div>
<!-- Trust Micro-indicator -->

</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    const strengthLabel = document.getElementById('strengthLabel');
    const strengthTag = document.getElementById('strengthTag');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (passwordInput) {
      passwordInput.addEventListener('input', (e) => {
        const val = e.target.value;
        const len = val.length;

        // Reset indicators
        bar1.className = 'h-full rounded-full transition-colors duration-300';
        bar2.className = 'h-full rounded-full transition-colors duration-300';
        bar3.className = 'h-full rounded-full transition-colors duration-300';

        if (len === 0) {
          bar1.classList.add('bg-surface-container-highest');
          bar2.classList.add('bg-surface-container-highest');
          bar3.classList.add('bg-surface-container-highest');
          strengthLabel.textContent = 'Minimum 8 characters';
          strengthTag.textContent = 'Empty';
          strengthTag.className = 'font-label-sm text-label-sm font-semibold text-outline';
        } else if (len < 6) {
          bar1.classList.add('bg-tertiary-container');
          bar2.classList.add('bg-surface-container-highest');
          bar3.classList.add('bg-surface-container-highest');
          strengthLabel.textContent = 'Too short';
          strengthTag.textContent = 'Weak';
          strengthTag.className = 'font-label-sm text-label-sm font-semibold text-tertiary';
        } else if (len < 10) {
          bar1.classList.add('bg-secondary');
          bar2.classList.add('bg-secondary');
          bar3.classList.add('bg-surface-container-highest');
          strengthLabel.textContent = 'Add symbols or numbers';
          strengthTag.textContent = 'Good';
          strengthTag.className = 'font-label-sm text-label-sm font-semibold text-secondary';
        } else {
          bar1.classList.add('bg-primary');
          bar2.classList.add('bg-primary');
          bar3.classList.add('bg-primary');
          strengthLabel.textContent = 'High defense ledger key';
          strengthTag.textContent = 'Strong';
          strengthTag.className = 'font-label-sm text-label-sm font-semibold text-primary';
        }
      });
    }
  })();
</script></main>

</body></html>
