<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{min-height:100%;margin:0;padding:0;background-color:#131313;color:#e5e2e1;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed": "#ffdadb", "inverse-on-surface": "#313030", "on-primary-fixed-variant": "#005236", "on-tertiary-container": "#780021", "secondary-fixed": "#85f8c4", "surface-container-low": "#1c1b1b", "secondary": "#68dba9", "primary-fixed": "#6ffbbe", "outline": "#86948a", "surface-container-high": "#2a2a2a", "surface-container-highest": "#353534", "error": "#ffb4ab", "tertiary": "#ffb2b7", "on-secondary-fixed": "#002114", "primary": "#4edea3", "on-tertiary-fixed-variant": "#92002a", "outline-variant": "#3c4a42", "on-surface-variant": "#bbcabf", "on-primary": "#003824", "on-primary-fixed": "#002113", "inverse-surface": "#e5e2e1", "tertiary-container": "#ff7886", "error-container": "#93000a", "on-secondary": "#003825", "on-error": "#690005", "primary-container": "#10b981", "secondary-fixed-dim": "#68dba9", "on-primary-container": "#00422b", "surface-container": "#201f1f", "tertiary-fixed-dim": "#ffb2b7", "surface-container-lowest": "#0e0e0e", "on-tertiary-fixed": "#40000d", "surface-dim": "#131313", "on-secondary-fixed-variant": "#005137", "secondary-container": "#25a475", "on-error-container": "#ffdad6", "inverse-primary": "#006c49", "on-tertiary": "#67001b", "surface-bright": "#3a3939", "on-secondary-container": "#00311f", "surface-tint": "#4edea3", "primary-fixed-dim": "#4edea3", "surface-variant": "#353534", "on-background": "#e5e2e1", "background": "#131313", "on-surface": "#e5e2e1", "surface": "#131313" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-tablet": "2rem", "space-lg": "1.5rem", "gutter": "1rem", "margin": "1rem", "space-xs": "0.25rem", "space-md": "1rem", "space-sm": "0.5rem", "margin-desktop": "3rem", "gutter-desktop": "1.5rem", "space-xl": "2rem" }, "fontFamily": { "label-sm": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "label-md": ["Inter"], "headline-lg": ["Plus Jakarta Sans"], "data-mono-md": ["Inter"], "data-mono-lg": ["Inter"], "headline-xl-mobile": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Inter"] }, "fontSize": { "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.006em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.011em", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.006em", "fontWeight": "500" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.025em", "fontWeight": "600" }], "data-mono-md": ["16px", { "lineHeight": "20px", "letterSpacing": "-0.02em", "fontWeight": "500" }], "data-mono-lg": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.03em", "fontWeight": "600" }], "headline-xl-mobile": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full px-margin py-space-lg bg-surface"><div class="flex flex-col w-full relative">
<!-- Ambient Soft Emerald Aura -->
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-72 h-44 pointer-events-none rounded-full opacity-40 blur-3xl bg-primary-container/20"></div>
<!-- Brand Identity Stack -->
<div class="relative flex flex-col items-center text-center pt-2 pb-6">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container-high shadow-md mb-3"><svg class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" fill="rgba(78,222,163,0.12)"></path><path d="M6 2v20"></path><path d="M10 7h6"></path><path d="M10 11h6"></path><path d="M10 15h4"></path></svg></div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tight text-on-surface flex items-center justify-center gap-1.5">
<span class="">Uddhar</span><span class="text-primary font-bold">Diary</span>
</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[260px] mt-1 text-center">
      Split the bill. Never lose track of who owes what.
    </p>
</div>
<!-- Authentication Card -->
<div class="w-full bg-surface-container rounded-xl p-5 shadow-xl flex flex-col gap-5">
<!-- Segmented Mode Switcher -->
<div class="w-full bg-surface-container-lowest p-1 rounded-lg flex items-center">
<button class="flex-1 min-h-[44px] rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center bg-surface-container-high text-primary font-semibold shadow-sm" id="tab-login" type="button">
        Log in
      </button>
<button class="flex-1 min-h-[44px] rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center text-on-surface-variant hover:text-on-surface font-medium" id="tab-signup" type="button">
        Sign up
      </button>
</div>
<!-- Context Intro -->
<div class="flex flex-col gap-0.5">
<span class="font-label-sm text-label-sm tracking-wider uppercase text-primary font-semibold">
        Welcome Back
      </span>
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">
        Log in to your account
      </h2>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-4" id="auth-form" onsubmit="event.preventDefault(); handleAuthSubmit();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="email-input">
          Email address
        </label>
<div class="relative flex items-center">
<input class="w-full min-h-[48px] px-3.5 bg-surface-container-low text-on-surface placeholder:text-outline text-body-md font-body-md rounded-xl transition duration-150 outline-none focus:bg-surface-container-high" id="email-input" placeholder="you@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="password-input">
            Password
          </label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#forgot">
            Forgot password?
          </a>
</div>
<div class="relative flex items-center">
<input class="w-full min-h-[48px] pl-3.5 pr-12 bg-surface-container-low text-on-surface placeholder:text-outline text-body-md font-body-md rounded-xl transition duration-150 outline-none focus:bg-surface-container-high" id="password-input" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-lg" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Device Control -->

<!-- Primary Action -->
<button class="w-full min-h-[48px] mt-1 bg-primary-container hover:bg-secondary-container active:scale-[0.98] text-on-primary-container font-label-lg text-label-lg font-semibold rounded-xl flex items-center justify-center gap-2 transition-all duration-150 shadow-md" id="submit-btn" type="submit">
<span class="">Log in</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
</form>
<!-- Social / Quick Options Divider -->

<!-- Quick Alternate Identity Row -->

<!-- Bottom Account Swap -->
<div class="pt-1 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Don't have an account? 
        <button class="font-label-sm text-label-sm text-primary hover:text-primary-fixed ml-1 font-semibold underline underline-offset-4" id="switch-to-signup" type="button">
          Sign up
        </button>
</p>
</div>
</div>
<!-- Trust Verification Footer Stamp -->

</div>
<script>
  (function () {
    const pwdInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const switchSignup = document.getElementById('switch-to-signup');
    const submitBtn = document.getElementById('submit-btn');

    function setActiveTab(isLogin) {
      if (isLogin) {
        tabLogin.className = 'flex-1 min-h-[44px] rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center bg-surface-container-high text-primary font-semibold shadow-sm';
        tabSignup.className = 'flex-1 min-h-[44px] rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center text-on-surface-variant hover:text-on-surface font-medium';
        if (submitBtn) {
          submitBtn.innerHTML = '<span>Log in</span><span class="material-symbols-outlined text-base">arrow_forward</span>';
        }
      } else {
        tabSignup.className = 'flex-1 min-h-[44px] rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center bg-surface-container-high text-primary font-semibold shadow-sm';
        tabLogin.className = 'flex-1 min-h-[44px] rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center text-on-surface-variant hover:text-on-surface font-medium';
        if (submitBtn) {
          submitBtn.innerHTML = '<span>Create ledger account</span><span class="material-symbols-outlined text-base">arrow_forward</span>';
        }
      }
    }

    if (tabLogin && tabSignup) {
      tabLogin.addEventListener('click', () => setActiveTab(true));
      tabSignup.addEventListener('click', () => setActiveTab(false));
    }

    if (switchSignup) {
      switchSignup.addEventListener('click', () => setActiveTab(false));
    }

    window.handleAuthSubmit = function() {
      const email = document.getElementById('email-input').value;
      if (submitBtn) {
        const originalContent = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="inline-block animate-spin mr-1">◌</span> Verifying ledger key...';
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-base">check_circle</span> Welcome back!';
          setTimeout(() => {
            submitBtn.innerHTML = originalContent;
          }, 1800);
        }, 1200);
      }
    };
  })();
</script></main>

</body></html>
